name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Qt-free-core claim, checked mechanically rather than asserted: these run
  # with no QGIS and no Qt installed at all. If an import creeps into core/, this
  # job is where it shows up.
  core:
    name: core (no QGIS, no Qt)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - name: Assert QGIS really is absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("qgis") is not None:
              sys.exit("qgis is importable — this job no longer proves anything")
          print("qgis not importable, as intended")
          PY
      - run: python -m pytest tests/ -q

  # Build ONCE. Every later job verifies this exact artifact, so "the package
  # that was tested" and "the package that was published" cannot diverge.
  package:
    name: package
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      name: ${{ steps.build.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: build
        run: |
          python tools/package.py
          ZIP=$(ls dist/crs_inspector-*.zip)
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: crs-inspector-plugin
          path: dist/*.zip
          if-no-files-found: error

  # Verifies the artifact the package job produced — not a rebuild of its own.
  # Constructing the panel on BOTH toolkits is the point: the enum-scoping break
  # was invisible until a widget existed, and development happens on Qt6 only.
  qgis:
    name: qgis ${{ matrix.tag }} (expect Qt${{ matrix.qt_major }})
    needs: package
    runs-on: ubuntu-latest
    container: qgis/qgis:${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: ltr          # 3.44
            qt_major: "5"
          - tag: stable       # 4.2
            qt_major: "6"
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crs-inspector-plugin
          path: dist
      - name: Confirm the artifact is the one that was built
        run: |
          ZIP="dist/${{ needs.package.outputs.name }}"
          echo "$ZIP"
          echo "${{ needs.package.outputs.sha256 }}  $ZIP" | sha256sum -c -
      # Two moving image tags could silently converge on one Qt major, leaving
      # two green jobs that no longer prove the distinction they exist for.
      - name: Assert this target really is Qt${{ matrix.qt_major }}
        run: |
          python3 - <<PY
          import sys
          from qgis.core import Qgis
          from qgis.PyQt.QtCore import QT_VERSION_STR
          major = QT_VERSION_STR.split(".")[0]
          print("QGIS", Qgis.QGIS_VERSION, "| Qt", QT_VERSION_STR)
          if major != "${{ matrix.qt_major }}":
              sys.exit("expected Qt ${{ matrix.qt_major }}, found " + QT_VERSION_STR)
          PY
      - name: Verify that exact package
        run: python3 tools/verify_package.py --zip "dist/${{ needs.package.outputs.name }}"
      # Enters through classFactory -> initGui -> the real action, so ownership
      # and per-layer subscriptions are exercised through the plugin's own
      # lifecycle rather than around it.
      # Bound to the SAME artifact, so lifecycle evidence and package evidence
      # describe one thing rather than two.
      - name: Drive the plugin lifecycle (functional)
        run: python3 tools/lifecycle_check.py --zip "dist/${{ needs.package.outputs.name }}"
      # A separate claim: normal process termination with the plugin loaded and
      # unloaded. os._exit in the functional run skips interpreter cleanup, so
      # that run establishes behaviour only - never that shutdown succeeds.
      - name: Normal shutdown with the plugin loaded
        run: python3 tools/lifecycle_check.py --zip "dist/${{ needs.package.outputs.name }}" --normal-exit
